<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Clipboard icon -->
    <rect x="-80" y="-120" width="160" height="200" rx="16" fill="none" stroke="white" stroke-width="12"/>
    <rect x="-40" y="-140" width="80" height="40" rx="8" fill="white"/>
    <!-- Checkmark -->
    <path d="M -40 -20 L -10 10 L 40 -40" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lines -->
    <line x1="-40" y1="40" x2="40" y2="40" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="-40" y1="60" x2="20" y2="60" stroke="white" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
